<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucky Spin Casino</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="casino-container">
    <h1>🎰 Lucky Spin Casino 🎰</h1>
    <p>Spin the wheel for a chance to win a free spin or free bonus bet!</p>

    <div class="wheel-area">
      <div class="hook"></div>

      <div class="wheel" id="wheel">
        <div class="prize p1">FREE SPIN</div>
        <div class="prize p2">FREE BET</div>
        <div class="prize p3">$5 BET</div>
        <div class="prize p4">TRY AGAIN</div>
        <div class="prize p5">$10 BET</div>
        <div class="prize p6">BONUS</div>

        <button class="center" id="spinBtn">SPIN</button>
      </div>
    </div>

    <h2 id="result">Click SPIN to play!</h2>

    <div class="rewards">
      <div class="reward-card">
        <h2>🎡 Free Spins</h2>
        <p id="freeSpinCount">You have 0 free spins.</p>
        <button id="useSpinBtn">Use Free Spin</button>
      </div>

      <div class="reward-card">
        <h2>🎁 Free Bets</h2>
        <p id="freeBetCount">You have 0 free bets.</p>
        <button id="useBetBtn">Use Free Bet</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
