<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucky Spin Casino</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="casino-container">
    <h1>🎰 Lucky Spin Casino 🎰</h1>

    <div class="ad-banner">
      🔥 LIMITED TIME OFFER: Claim Free Bets & Free Spins Today! 🔥
    </div>

    <p>Spin the wheel and win a bonus reward!</p>

    <div class="wheel-area">
      <div class="pointer"></div>

      <div class="wheel" id="wheel">
        <div class="label label1">FREE SPIN</div>
        <div class="label label2">FREE BET</div>
        <div class="label label3">$5 BET</div>
        <div class="label label4">BONUS</div>
        <div class="label label5">$10 BET</div>
        <div class="label label6">TRY AGAIN</div>

        <button class="spin-center" id="spinBtn">SPIN</button>
      </div>
    </div>

    <h2 id="result">Click SPIN to play!</h2>

    <div class="rewards">
      <div class="reward-card">
        <h2>🎡 Free Spins</h2>
        <p id="freeSpinCount">You have 0 free spins.</p>
        <button id="useSpinBtn">Use Free Spin</button>
      </div>

      <div class="reward-card">
        <h2>🎁 Free Bets</h2>
        <p id="freeBetCount">You have 0 free bets.</p>
        <button id="useBetBtn">Use Free Bet</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
