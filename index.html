<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucky Spin Casino</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="casino-container">
    <h1>🎰 Lucky Spin Casino 🎰</h1>
    <p>Spin the wheel for a chance to win a free spin or free bonus bet!</p>

    <div class="wheel-area">
      <div class="hook"></div>

      <div class="wheel">
        <div class="prize p1">FREE SPIN</div>
        <div class="prize p2">FREE BET</div>
        <div class="prize p3">$5 BET</div>
        <div class="prize p4">TRY AGAIN</div>
        <div class="prize p5">$10 BET</div>
        <div class="prize p6">BONUS</div>
        <div class="center">SPIN</div>
      </div>
    </div>

    <div class="rewards">
      <div class="reward-card">
        <h2>🎡 Free Spin</h2>
        <p>Use this to spin the wheel one extra time.</p>
        <button>Use Free Spin</button>
      </div>

      <div class="reward-card">
        <h2>🎁 Free Bet</h2>
        <p>Use this bonus bet on your next game.</p>
        <button>Use Free Bet</button>
      </div>
    </div>
  </div>

</body>
</html>
